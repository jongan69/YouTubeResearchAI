<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>YTResearchAI — Turn Any Video Into a PhD-Grade Research Report</title>
<meta name="description" content="Free web app. Paste any video URL from 1,750+ sites, get a fully cited research report with peer-reviewed sources. Automated literature search, claim verification, and citations.">
<meta name="keywords" content="video research, academic research, AI research assistant, literature search, citation generator, video to research paper, PhD research tool, automated literature review, evidence synthesis, transcript to paper, research pipeline, open source, peer-reviewed citations, semantic scholar, arxiv, crossref, openalex, yt-dlp, nodejs, free">
<meta name="author" content="YouTube Research AI">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#090D15">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="canonical" href="https://jongan69.github.io/YouTubeResearchAI/">
<meta property="og:title" content="YTResearchAI — Turn Any Video Into a PhD-Grade Research Report">
<meta property="og:description" content="Free open-source tool. Paste any video URL, get a fully cited research report. 1,750+ sites supported.">
<meta property="og:image" content="https://raw.githubusercontent.com/jongan69/YouTubeResearchAI/main/imageAssets/youtube-research-ai-social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jongan69.github.io/YouTubeResearchAI/">
<meta property="og:site_name" content="YTResearchAI">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="YTResearchAI — Turn Any Video Into a Research Report">
<meta name="twitter:description" content="Free. Open source. Paste a URL, get a cited research report.">
<meta name="twitter:image" content="https://raw.githubusercontent.com/jongan69/YouTubeResearchAI/main/imageAssets/youtube-research-ai-social-card.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="logo-row">
      <img src="https://raw.githubusercontent.com/jongan69/YouTubeResearchAI/main/imageAssets/youtube-research-ai-mark.svg" alt="YTResearchAI" width="40" height="40" style="filter:drop-shadow(0 2px 8px rgba(88,166,255,0.25))">
      <h1>YTResearchAI</h1>
    </div>
    <p class="tagline">Turn any video into a PhD-grade research report — <a href="https://github.com/jongan69/YouTubeResearchAI" target="_blank" rel="noopener">free &amp; open source</a></p>
  </header>

  <section class="card" id="form-section">
    <div class="form-row">
      <input type="url" id="url-input" placeholder="Paste a video URL (YouTube, Vimeo, TikTok, Coursera, etc.)" autofocus>
      <button id="submit-btn" class="btn-primary">Generate Report</button>
    </div>
    <div class="options-row" id="options-row" style="display:none">
      <label class="opt"><input type="checkbox" id="opt-research" checked> 📚 Literature search + citations</label>
      <label class="opt"><input type="checkbox" id="opt-verify"> 🔬 Verify claims</label>
      <label class="opt"><input type="checkbox" id="opt-vision"> 🖼️ Visual analysis</label>
      <select id="opt-style" class="opt-select">
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
        <option value="ieee">IEEE</option>
      </select>
      <button id="options-toggle" class="btn-ghost">⚙️ Options</button>
    </div>
    <div class="key-row" id="key-row">
      <input type="password" id="api-key-input" placeholder="Your OpenAI API key (optional — 10 free reports/day available)">
      <span class="key-hint" id="key-hint"></span>
    </div>
    <div id="form-status"></div>
  </section>

  <section class="card" id="progress-section" style="display:none">
    <div class="progress-header">
      <span id="progress-stage">Starting...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <p class="progress-msg" id="progress-msg">Initializing pipeline...</p>
  </section>

  <section class="card" id="report-section" style="display:none">
    <div class="report-actions">
      <button id="download-md" class="btn-secondary">⬇ Markdown</button>
      <button id="download-json" class="btn-secondary">⬇ JSON</button>
      <button id="copy-link" class="btn-ghost">🔗 Copy Link</button>
      <button id="new-report-btn" class="btn-ghost">+ New</button>
    </div>
    <div id="report-meta"></div>
    <div id="report-content" class="report-content"></div>
  </section>

  <section class="card card-error" id="error-section" style="display:none">
    <h3>⚠️ Something went wrong</h3>
    <p id="error-msg"></p>
    <button id="retry-btn" class="btn-primary">Try Again</button>
  </section>

  <section class="card" id="recent-section" style="display:none">
    <h3>📋 Recent Reports</h3>
    <div id="recent-list"></div>
  </section>

  <footer class="app-footer">
    <p>
      <a href="https://github.com/jongan69/YouTubeResearchAI" target="_blank">GitHub</a> ·
      <a href="https://github.com/jongan69/YouTubeResearchAI#readme" target="_blank">Docs</a> ·
      Built for researchers
    </p>
  </footer>
</div>

<script>window.__API_URL__='https://ytresearch-122045959146.us-central1.run.app';</script>
<script src="js/app.mjs" type="module"></script>
</body>
</html>
