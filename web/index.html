<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTResearchAI — Turn Any Video Into a PhD-Grade Research Report</title>
<meta name="description" content="Free web app. Paste any video URL, get a fully cited research report with peer-reviewed sources. 1,750+ sites supported.">
<meta name="theme-color" content="#090D15">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="logo-row">
      <span class="logo-icon">🔬</span>
      <h1>YTResearchAI</h1>
    </div>
    <p class="tagline">Turn any video into a PhD-grade research report — free & open source</p>
  </header>

  <!-- URL Form -->
  <section class="card" id="form-section">
    <div class="form-row">
      <input type="url" id="url-input" placeholder="Paste a video URL (YouTube, Vimeo, TikTok, etc.)" autofocus>
      <button id="submit-btn" class="btn-primary">Generate Report</button>
    </div>

    <!-- Options -->
    <div class="options-row" id="options-row" style="display:none;">
      <label class="opt"><input type="checkbox" id="opt-research" checked> Literature search + citations</label>
      <label class="opt"><input type="checkbox" id="opt-verify"> Verify claims</label>
      <label class="opt"><input type="checkbox" id="opt-vision"> Visual analysis</label>
      <select id="opt-style" class="opt-select">
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
        <option value="ieee">IEEE</option>
      </select>
      <button id="options-toggle" class="btn-ghost">⚙️ Options</button>
    </div>

    <!-- API Key -->
    <div class="key-row" id="key-row">
      <input type="password" id="api-key-input" placeholder="Your OpenAI API key (optional — free tier available)">
      <span class="key-hint" id="key-hint"></span>
    </div>

    <div id="form-status"></div>
  </section>

  <!-- Progress -->
  <section class="card" id="progress-section" style="display:none;">
    <div class="progress-header">
      <span id="progress-stage">Starting...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <p class="progress-msg" id="progress-msg">Initializing pipeline...</p>
  </section>

  <!-- Report -->
  <section class="card" id="report-section" style="display:none;">
    <div class="report-actions">
      <button id="download-md" class="btn-secondary">⬇ Download Markdown</button>
      <button id="download-json" class="btn-secondary">⬇ Download JSON</button>
      <button id="copy-link" class="btn-ghost">🔗 Copy Link</button>
      <button id="new-report-btn" class="btn-ghost">+ New Report</button>
    </div>
    <div id="report-meta"></div>
    <div id="report-content" class="report-content"></div>
  </section>

  <!-- Error -->
  <section class="card card-error" id="error-section" style="display:none;">
    <h3>⚠️ Something went wrong</h3>
    <p id="error-msg"></p>
    <button id="retry-btn" class="btn-primary">Try Again</button>
  </section>

  <!-- Recent Jobs -->
  <section class="card" id="recent-section" style="display:none;">
    <h3>📋 Recent Reports</h3>
    <div id="recent-list"></div>
  </section>

  <!-- Footer -->
  <footer class="app-footer">
    <p>
      <a href="https://github.com/jongan69/YouTubeResearchAI" target="_blank">GitHub</a> ·
      <a href="https://github.com/jongan69/YouTubeResearchAI#readme" target="_blank">Docs</a> ·
      Built with ❤️ for researchers
    </p>
  </footer>
</div>

<script src="js/app.mjs" type="module"></script>
</body>
</html>
